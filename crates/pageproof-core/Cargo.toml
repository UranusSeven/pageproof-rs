[package]
name = "pageproof-core"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Verus-verified KV block manager and slab coordinator (pageproof contract v0.3)"

[dependencies]
# Pinned to the vstd published alongside the locked Verus release (see toolchain.json).
vstd = "=0.0.0-2026-11-01-0251"
# Only used inside the single trusted E8 wrapper (src/e8.rs).
sha2 = "=0.10.9"

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_only)', 'cfg(verus_keep_ghost)'] }

[dev-dependencies]
sha2 = "=0.10.9"
