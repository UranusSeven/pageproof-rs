[package]
name = "pageproof-py"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Thin, unverified PyO3 facade over the verified pageproof-core"

[lib]
name = "pageproof"
crate-type = ["cdylib"]

[dependencies]
pageproof-core = { path = "../pageproof-core" }
pyo3 = { version = "=0.30.1", features = ["extension-module"] }
